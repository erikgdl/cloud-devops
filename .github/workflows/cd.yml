name: CD

# Só faz deploy quando existir push na master
on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - name: Baixar código
        uses: actions/checkout@v4

      # Autentica o GitHub Actions no GHCR
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Constrói a imagem e envia para o GitHub Container Registry
      - name: Build e push da imagem
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}:latest"

          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"

      # Cria a chave SSH temporariamente dentro da máquina do GitHub Actions
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Cria a pasta de produção e envia o Docker Compose para a VPS
      - name: Enviar configuração para VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p ~/devops-app"

          scp compose.prod.yaml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/devops-app/compose.yaml

      # Baixa a imagem nova e atualiza o container
      - name: Deploy na VPS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}:latest"

          echo "$GH_TOKEN" | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/devops-app &&
            IMAGE_NAME='$IMAGE_NAME' docker compose pull &&
            IMAGE_NAME='$IMAGE_NAME' docker compose up -d &&
            docker image prune -f
          "