<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1018" />
    <title>Apresentação | Cloud/Ops</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;700;800&display=swap');
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #fff; background: #0b1018; font-family: Manrope, Arial, sans-serif; }
      body::before { content: ''; position: fixed; inset: 0; opacity: .5; background-image: linear-gradient(rgba(101, 121, 153, .14) 1px, transparent 1px), linear-gradient(90deg, rgba(101, 121, 153, .14) 1px, transparent 1px); background-size: 42px 42px; mask-image: radial-gradient(circle, #000, transparent 75%); }
      main { position: relative; width: min(780px, calc(100% - 40px)); padding: 70px 40px; border: 1px solid #293442; text-align: center; background: rgba(15, 23, 34, .9); box-shadow: 12px 12px 0 #2854ff; }
      .mark { width: 52px; height: 52px; margin: 0 auto 32px; display: grid; place-items: center; color: #0b1018; background: #b8f135; font-family: 'DM Mono', monospace; font-weight: 500; transform: rotate(45deg); }
      .mark span { transform: rotate(-45deg); }
      small { color: #b8f135; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; }
      h1 { margin: 20px 0 18px; font-size: clamp(42px, 8vw, 78px); line-height: .95; letter-spacing: -.07em; }
      h1 span { color: #647080; }
      p { max-width: 520px; margin: 0 auto 35px; color: #8994a2; font-size: 15px; line-height: 1.7; }
      a { min-height: 48px; padding: 0 20px; display: inline-flex; align-items: center; color: #fff; border: 1px solid #3a4655; font-size: 12px; font-weight: 700; text-decoration: none; }
      a:hover { color: #0b1018; background: #b8f135; }
      @media (max-width: 520px) { main { padding: 55px 22px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><span>02</span></div>
      <small>N2 / APRESENTAÇÃO INTERATIVA</small>
      <h1>Os slides estão<br /><span>a caminho.</span></h1>
      <p>Esta área receberá a apresentação horizontal e interativa do projeto Cloud & DevOps.</p>
      <a href="/">Voltar para o projeto</a>
    </main>
  </body>
</html>
